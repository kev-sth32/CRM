version: '3.8'

services:
  salesos-web:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://salesos_user:salesos_secure_password@postgres:5432/salesos_db
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - AI_PROVIDER=${AI_PROVIDER:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - salesos-net
    expose:
      - "3000"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: salesos_user
      POSTGRES_PASSWORD: salesos_secure_password
      POSTGRES_DB: salesos_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesos_user -d salesos_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - salesos-net

  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - salesos-web
    networks:
      - salesos-net

networks:
  salesos-net:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
