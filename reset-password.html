<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Your Password — SalesOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
  <style>
    body {
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      margin: 0;
      font-family: var(--font-sans);
    }
    .reset-container {
      width: 100%;
      max-width: 440px;
    }
    .reset-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 12px;
      font-size: 24px;
      margin-bottom: 12px;
    }
    .brand-header h1 {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
      margin: 0 0 6px;
    }
    .brand-header p {
      font-size: 13px;
      color: #64748b;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="reset-container">
    <div class="reset-card">
      <div class="brand-header">
        <div class="brand-icon">🔑</div>
        <h1>Set New Password</h1>
        <p>Choose a strong password to secure your workspace.</p>
      </div>

      <form id="resetForm" onsubmit="handleResetSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input type="password" id="newPassword" class="form-control" placeholder="At least 8 characters" required minlength="6" autocomplete="new-password">
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input type="password" id="confirmPassword" class="form-control" placeholder="Re-enter password" required minlength="6" autocomplete="new-password">
        </div>

        <div id="resetError" style="color:var(--red);font-size:12px;margin-bottom:14px;min-height:16px"></div>

        <button type="submit" class="btn btn-primary" id="resetBtn" style="width:100%;padding:12px;font-size:14px;font-weight:600">
          Update Password & Sign In
        </button>

        <div style="text-align:center;margin-top:16px">
          <a href="/login.html" style="font-size:13px;color:var(--primary);text-decoration:none">Back to Sign In</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    async function handleResetSubmit(e) {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      const errorEl = document.getElementById('resetError');
      const btn = document.getElementById('resetBtn');

      errorEl.textContent = '';
      if (p1 !== p2) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get('token');
      if (!token) {
        errorEl.textContent = 'Invalid or missing password reset token.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Updating password...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, new_password: p1 })
        });
        const data = await res.json();
        if (res.ok) {
          btn.textContent = '✓ Password Updated!';
          btn.style.background = 'var(--green)';
          setTimeout(() => {
            window.location.href = '/login.html?reset=success';
          }, 600);
        } else {
          errorEl.textContent = data.error || 'Failed to reset password. Link may have expired.';
          btn.disabled = false;
          btn.textContent = 'Update Password & Sign In';
        }
      } catch (err) {
        errorEl.textContent = 'Network error while updating password.';
        btn.disabled = false;
        btn.textContent = 'Update Password & Sign In';
      }
    }
  </script>
</body>
</html>
