<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalesOS Workspace Router</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:var(--bg)">
  <div class="card" style="padding:36px;text-align:center;max-width:440px">
    <div class="spinner"></div>
    <h3 style="margin:12px 0 6px">Loading SalesOS Module...</h3>
    <p style="color:var(--muted);font-size:13px">Directing you to the active workspace page...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || 'dashboard';

    const routes = {
      dashboard: '/index.html',
      leads: '/leads.html',
      contacts: '/contacts.html',
      companies: '/companies.html',
      deals: '/deals.html',
      products: '/products.html',
      tasks: '/tasks.html',
      campaigns: '/campaigns.html',
      automations: '/automations.html',
      reports: '/reports.html',
      settings: '/settings.html',
      inbox: '/inbox.html',
      approvals: '/approvals.html',
      agents: '/approvals.html'
    };

    const target = routes[view.toLowerCase()] || '/index.html';
    window.location.replace(target);
  </script>
</body>
</html>
