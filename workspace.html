<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SalesOS Workspace Router</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body style="display:grid;place-items:center;min-height:100vh;background:var(--bg)">
  <div class="card" style="padding:36px;text-align:center;max-width:440px">
    <div class="spinner"></div>
    <h3 style="margin:12px 0 6px">Loading SalesOS Module...</h3>
    <p style="color:var(--muted);font-size:13px">Directing you to the active workspace page...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const view = params.get('view') || 'dashboard';

    const routes = {
      dashboard: '/',
      leads: '/leads',
      contacts: '/contacts',
      companies: '/companies',
      deals: '/deals',
      products: '/products',
      tasks: '/tasks',
      campaigns: '/campaigns',
      automations: '/automations',
      reports: '/reports',
      settings: '/settings',
      inbox: '/inbox',
      approvals: '/approvals',
      agents: '/approvals'
    };

    const target = routes[view.toLowerCase()] || '/';
    window.location.replace(target);
  </script>
</body>
</html>
